<!doctype html><!--local-only-->
<html lang="en"><!--local-only-->
<head><!--local-only-->
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!--local-only-->
<title>Athens Pistols Stats</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=Sofia+Sans+Extra+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: black scoreboard band (brand + section tabs + filter rail) over one 1240px column of panels.
   Dark-first (black + Pistols orange); a light variant keeps the black band. */
:root{
  color-scheme: dark;
  --bg:#0d0c0b; --surface:#171513; --surface-2:#211e1b; --line:#2e2a26; --grid:#26231f; --axis:#3f3a35;
  --fg:#f4f0ea; --fg-2:#c9c1b6; --muted:#8f877c;
  --accent:#ff7a2f; --accent-text:#ff9152; --accent-ink:#170a02; --accent-wash:rgba(255,122,47,.12);
  --band:#0a0908; --band-2:#1a1714; --band-line:#2a2521; --band-fg:#f4f0ea; --band-muted:#a0978b; --band-accent:#ff7a2f;
  --s-us:#e8672c; --s-us-wash:rgba(232,103,44,.14); --s-them:#d9d3ca; --s-loss:#5c554e; --s-2:#3987e5; --s-3:#199e70;
  --font-display:'Sofia Sans Extra Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --font-body:'Commissioner',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#f4f1ec; --surface:#ffffff; --surface-2:#f2ede6; --line:#e3ddd4; --grid:#ece7e0; --axis:#c8c1b7;
    --fg:#15120f; --fg-2:#4d463f; --muted:#7f766c;
    --accent:#ea5f1c; --accent-text:#b4470f; --accent-ink:#ffffff; --accent-wash:rgba(234,95,28,.09);
    --s-us:#eb6834; --s-us-wash:rgba(235,104,52,.12); --s-them:#2b2724; --s-loss:#bdb5ab; --s-2:#2a78d6; --s-3:#1baf7a;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#f4f1ec; --surface:#ffffff; --surface-2:#f2ede6; --line:#e3ddd4; --grid:#ece7e0; --axis:#c8c1b7;
  --fg:#15120f; --fg-2:#4d463f; --muted:#7f766c;
  --accent:#ea5f1c; --accent-text:#b4470f; --accent-ink:#ffffff; --accent-wash:rgba(234,95,28,.09);
  --s-us:#eb6834; --s-us-wash:rgba(235,104,52,.12); --s-them:#2b2724; --s-loss:#bdb5ab; --s-2:#2a78d6; --s-3:#1baf7a;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0c0b; --surface:#171513; --surface-2:#211e1b; --line:#2e2a26; --grid:#26231f; --axis:#3f3a35;
  --fg:#f4f0ea; --fg-2:#c9c1b6; --muted:#8f877c;
  --accent:#ff7a2f; --accent-text:#ff9152; --accent-ink:#170a02; --accent-wash:rgba(255,122,47,.12);
  --s-us:#e8672c; --s-us-wash:rgba(232,103,44,.14); --s-them:#d9d3ca; --s-loss:#5c554e; --s-2:#3987e5; --s-3:#199e70;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1;margin:0;text-wrap:balance}
p{margin:0}
.gut{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}

/* ---------- top band */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-fg);border-bottom:1px solid var(--band-line)}
.brandrow{display:flex;align-items:center;gap:18px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;color:var(--band-fg);text-decoration:none;flex:none}
.brand:hover{text-decoration:none}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-family:var(--font-display);font-weight:800;font-size:23px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand span{font-family:var(--font-display);font-weight:600;font-size:23px;letter-spacing:.04em;text-transform:uppercase;color:var(--band-accent);line-height:1}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--band-muted);padding:17px 11px 15px;border-bottom:3px solid transparent;white-space:nowrap;text-decoration:none}
.nav a:hover{color:var(--band-fg)}
.nav a[aria-current="page"]{color:var(--band-fg);border-bottom-color:var(--band-accent)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:10px;border-top:1px solid var(--band-line)}
.filters .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--band-muted);font-weight:600}
.pop{position:relative}
.pop>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--band-line);border-radius:8px;background:var(--band-2);color:var(--band-fg);font-size:13.5px;user-select:none}
.pop>summary::-webkit-details-marker{display:none}
.pop>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--band-muted);border-bottom:2px solid var(--band-muted);transform:rotate(45deg) translateY(-2px);margin-left:2px}
.pop>summary b{font-weight:600;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop[open]>summary{border-color:var(--band-accent)}
.pop-body{position:absolute;top:40px;left:0;z-index:40;min-width:230px;max-height:340px;overflow:auto;background:var(--band-2);border:1px solid var(--band-line);border-radius:10px;padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.45);display:grid;gap:2px}
.opt{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--band-fg)}
.opt:hover{background:rgba(255,255,255,.06)}
.opt input{accent-color:var(--band-accent);width:16px;height:16px;margin:0}
.pop-clear{margin-top:4px;background:none;border:0;border-top:1px solid var(--band-line);color:var(--band-accent);text-align:left;padding:8px 8px 4px;font:inherit;font-size:13px;cursor:pointer}
.fsel{display:flex;align-items:center;gap:8px;height:34px;padding:0 4px 0 12px;border:1px solid var(--band-line);border-radius:8px;background:var(--band-2)}
.fsel select{background:transparent;color:var(--band-fg);border:0;font:inherit;font-size:13.5px;max-width:190px;height:32px;cursor:pointer}
.fsel select option{background:var(--band-2);color:var(--band-fg)}
.filters .seg{border-color:var(--band-line);background:var(--band-2)}
.filters .seg button{color:var(--band-muted)}
.filters .seg button[aria-pressed="true"]{background:var(--band-accent);color:#170a02}
.fchk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--band-fg);cursor:pointer;padding:0 4px}
.fchk input{accent-color:var(--band-accent);width:16px;height:16px;margin:0}
.f-reset{background:none;border:0;color:var(--band-accent);font:inherit;font-size:13px;cursor:pointer;padding:6px}
.f-count{margin-left:auto;font-size:12.5px;color:var(--band-muted)}

/* ---------- shared controls */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;overflow-x:auto;scrollbar-width:none;max-width:100%;background:var(--surface);flex:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;white-space:nowrap;background:none;border:0;font:inherit;font-size:13px;font-weight:600;padding:0 12px;height:32px;color:var(--fg-2);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.filters .seg button+button{border-left-color:var(--band-line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ctl{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.ctl select,.ctl input{text-transform:none;letter-spacing:0;font:inherit;font-size:13.5px;font-weight:500;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;height:32px;padding:0 8px}
.ctl input[type="number"]{width:70px}
.ctl input[type="search"]{width:200px;max-width:52vw}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0;max-width:100%}
.tools>*{min-width:0;max-width:100%}
.panel>*,.panel-h>*{min-width:0}
.ctl select{max-width:100%}
.f-toggle{display:none;align-items:center;gap:8px;height:34px;padding:0 14px;border:1px solid var(--band-line);border-radius:8px;background:var(--band-2);color:var(--band-fg);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.f-toggle b{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--band-accent);color:#170a02;font-size:12px}
.f-toggle::after{content:"";width:7px;height:7px;border-right:2px solid var(--band-muted);border-bottom:2px solid var(--band-muted);transform:rotate(45deg) translateY(-2px)}
.filters.open .f-toggle::after{transform:rotate(-135deg) translateY(-1px)}

/* ---------- layout */
main.gut{padding-block:26px 56px;display:grid;gap:18px}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:2px}
.view-head h1{font-size:clamp(38px,5vw,56px)}
.view-head .sub{color:var(--fg-2);margin-top:6px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent-text);margin-bottom:8px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:18px}
.grid-2>*,.grid-3>*,.grid-4>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;display:grid;gap:14px;align-content:start}
.panel-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.panel h2{font-size:22px;letter-spacing:.04em}
.panel .sub{color:var(--muted);font-size:13px;margin-top:4px}
.note{font-size:13px;color:var(--fg-2);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.note.warn{border-style:dashed}

/* ---------- hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,rgba(255,122,47,.16),transparent 55%),var(--band);color:var(--band-fg);border-radius:var(--r);padding:28px clamp(18px,3vw,36px);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px 28px;border:1px solid var(--band-line)}
.hero-main{display:grid;gap:18px;min-width:0}
.hero-logo{width:clamp(130px,17vw,210px);height:auto;filter:drop-shadow(0 12px 32px rgba(255,122,47,.28));animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hero h1{font-size:clamp(48px,8vw,92px);line-height:.88}
.hero .eyebrow{color:var(--band-accent)}
.hero-sub{color:var(--band-muted);margin-top:10px}
.hero-rec{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 26px;position:relative;z-index:1}
.rec-n{display:grid;gap:4px}
.rec-n b{font-family:var(--font-display);font-weight:800;font-size:clamp(56px,9vw,104px);line-height:.82}
.rec-n.w b{color:var(--band-accent)}
.rec-n span{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--band-muted);font-weight:600}
.rec-sep{font-family:var(--font-display);font-size:clamp(40px,6vw,72px);line-height:.9;color:var(--band-muted);align-self:center}
.rec-n.sm b{font-size:clamp(36px,5vw,56px)}
.hero-note{font-size:13px;color:var(--band-muted);position:relative;z-index:1}
.court{position:absolute;right:-30px;top:-24px;width:min(460px,70%);color:var(--band-accent);opacity:.2;pointer-events:none}
.hero>*:not(.court){position:relative;z-index:1}

/* ---------- KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpis.k8{grid-template-columns:repeat(8,minmax(0,1fr))}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.k8{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.kpis,.kpis.k8{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:34px}}
@media (max-width:1100px){.brandrow{flex-wrap:wrap;column-gap:14px;padding-top:10px}.brand{margin-right:auto}.nav{order:4;flex-basis:100%;margin-inline:-11px}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px;align-content:start}
.kpi .l{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--font-display);font-weight:800;font-size:40px;line-height:.9}
.kpi .s{font-size:12.5px;color:var(--fg-2)}
.kpi.hot .v{color:var(--accent-text)}

/* ---------- tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;max-width:100%}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th{background:var(--surface-2);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);text-align:right;padding:9px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl th button{all:unset;cursor:pointer;display:inline-block}
.tbl th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl th.sorted{color:var(--accent-text)}
.tbl td{padding:8px 10px;text-align:right;white-space:nowrap;border-top:1px solid var(--line);background:var(--surface)}
.tbl tbody tr:first-child td{border-top:0}
.tbl .txt{text-align:left}
.tbl th:first-child,.tbl td:first-child{position:sticky;left:0;z-index:1}
.tbl td:first-child{background:var(--surface)}
.tbl tr[data-href]{cursor:pointer}
.tbl tr[data-href]:hover td{background:var(--surface-2)}
.tbl tfoot td{background:var(--surface-2);font-weight:700;border-top:1px solid var(--axis)}
.tbl td.strong{font-weight:700;color:var(--fg)}
.tbl td.best{color:var(--accent-text);font-weight:700}
.tbl .empty-row{color:var(--muted);padding:18px 12px;white-space:normal}
.tbl td.rank{color:var(--muted);width:36px}

/* ---------- badges */
.res{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:6px;font-weight:700;font-size:12px;line-height:1;vertical-align:middle}
.res-W{background:var(--accent);color:var(--accent-ink)}
.res-L{background:var(--surface-2);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--line)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px dashed var(--muted);color:var(--muted);vertical-align:middle;line-height:1.3}
.mvp{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--accent-text);vertical-align:middle}
.mvp svg{width:13px;height:13px}
.score{font-weight:600}

/* ---------- form strip & lists */
.lead{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.lead li{display:grid;grid-template-columns:22px 1fr auto;align-items:baseline;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.lead li:first-child{border-top:0}
.lead .i{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.lead .n{min-width:0;overflow-wrap:anywhere;line-height:1.3}
.lead .v{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1}
.lead li:first-child .v{color:var(--accent-text)}
.lead .x{font-size:12px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.fact{border-top:2px solid var(--line);padding-top:10px;display:grid;gap:3px}
.fact .l{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fact .v{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1}
.fact .s{font-size:13px;color:var(--fg-2)}

/* ---------- charts */
.chart-box{position:relative;height:270px;min-width:0}
.chart-box.tall{height:340px}
.chart-box.short{height:220px}
.chart-box.radar{height:330px}
.chart-msg{display:grid;place-items:center;height:100%;color:var(--muted);font-size:13px;text-align:center;padding:12px}

/* ---------- scoreboard (game page) */
.scoreboard{background:var(--band);color:var(--band-fg);border:1px solid var(--band-line);border-radius:var(--r);padding:22px clamp(16px,3vw,32px);display:grid;gap:18px}
.sb-meta{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--band-muted);font-weight:600}
.sb-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px 20px}
.sb-team{display:flex;align-items:center;gap:16px;min-width:0}
.sb-team.them{justify-content:flex-end;text-align:right}
.sb-name{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,3.4vw,36px);text-transform:uppercase;line-height:1;min-width:0;overflow-wrap:anywhere}
.sb-name a{color:var(--band-fg)}
.sb-pts{font-family:var(--font-display);font-weight:800;font-size:clamp(54px,8vw,88px);line-height:.85}
.sb-team.us .sb-pts{color:var(--band-accent)}
.sb-mid{display:grid;justify-items:center;gap:6px}
.sb-mid .res{width:34px;height:34px;font-size:16px}
.qt{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px;width:100%;max-width:560px}
.qt th,.qt td{padding:6px 10px;text-align:center;border-bottom:1px solid var(--band-line)}
.qt th{font-size:11px;letter-spacing:.08em;color:var(--band-muted);font-weight:700}
.qt td:first-child,.qt th:first-child{text-align:left}
.qt td.t{font-weight:800;color:var(--band-fg)}
.qt td.won{color:var(--band-accent);font-weight:700}
.qt-wrap{overflow-x:auto}
.gnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px}

/* versus bars */
.vs{display:grid;gap:8px}
.vs-row{display:grid;grid-template-columns:1fr minmax(92px,auto) 1fr;align-items:center;gap:10px}
.vs-side{display:flex;align-items:center;gap:8px}
.vs-side.l{flex-direction:row-reverse}
.vs-bar{flex:1;height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;display:flex}
.vs-side.l .vs-bar{justify-content:flex-end}
.vs-bar i{display:block;height:100%;border-radius:5px}
.vs-side.l .vs-bar i{background:var(--s-us)}
.vs-side.r .vs-bar i{background:var(--s-them)}
.vs-v{min-width:46px;font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px}
.vs-side.l .vs-v{text-align:right}
.vs-v.better{color:var(--accent-text);font-weight:800}
.vs-lbl{text-align:center;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.vs-head{display:grid;grid-template-columns:1fr minmax(92px,auto) 1fr;gap:10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.vs-head span:first-child{text-align:right;color:var(--accent-text)}
.vs-head span:last-child{color:var(--fg-2)}
.key{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:baseline;margin-right:6px}

/* segmented bar (points source) */
.segbar{display:flex;gap:2px;height:28px}
.segbar>div{display:flex;align-items:center;padding-left:8px;border-radius:4px;color:#fff;font-size:12px;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--fg-2)}

/* player header */
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px 24px}
.phead h1{font-size:clamp(40px,6vw,68px);text-transform:none;letter-spacing:0}
.phead .raw{color:var(--muted);font-size:13.5px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg-2)}
.chip.hot{background:var(--accent-wash);border-color:transparent;color:var(--accent-text)}
.sel-row{display:flex;flex-wrap:wrap;gap:10px}
.glossary{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px 24px;font-size:13px;color:var(--fg-2)}
.glossary b{color:var(--fg);font-weight:700}
.empty{padding:28px;text-align:center;color:var(--fg-2)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
footer .gut{padding-block:20px 36px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}

/* ---------- upcoming games: calendar, next game, match preview */
.up-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
.cal{display:grid;gap:8px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-head b{font-family:var(--font-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font-size:15px;line-height:1}
.cal-nav button:hover{border-color:var(--accent);color:var(--accent-text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:700;padding:2px 0}
.cal-day{min-height:58px;border-radius:8px;background:var(--surface-2);padding:4px 5px;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--fg-2);text-decoration:none;border:1px solid transparent;min-width:0;overflow:hidden}
.cal-day.blank{background:transparent}
.cal-day.today{border-color:var(--fg-2)}
.cal-day .d{font-variant-numeric:tabular-nums;font-weight:600;font-size:11.5px}
a.cal-day:hover{text-decoration:none;border-color:var(--accent)}
.cal-day.next{background:var(--accent);color:var(--accent-ink)}
.cal-day.next .ev{color:var(--accent-ink)}
.cal-day .ev{display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;line-height:1.1;min-width:0}
.cal-day .ev .evt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media (max-width:560px){.cal-day .ev .evt{display:none}.cal-day{min-height:50px;padding:4px}}
.cal-day .res{width:18px;height:18px;font-size:10px;border-radius:5px;flex:none}
.cal-legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.cal-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.tlogo{display:inline-grid;place-items:center;border-radius:50%;background:#fff;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.tlogo img{width:100%;height:100%;object-fit:contain}
.tlogo b{display:none;font-family:var(--font-display);font-weight:800;color:#170a02;font-size:.42em;line-height:1}
.tlogo.nologo{background:var(--accent)}
.tlogo.nologo b{display:block}
.nextg{display:grid;gap:12px;padding:18px;border-radius:var(--r);background:var(--band);color:var(--band-fg);border:1px solid var(--band-line)}
.nextg .eyebrow{color:var(--band-accent);margin:0}
.ng-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ng-count{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--band-accent);color:#170a02}
.ng-vs{display:flex;align-items:center;gap:12px;min-width:0}
.ng-vs .x{font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--band-muted)}
.ng-vs .n{min-width:0}
.ng-vs .n b{display:block;font-family:var(--font-display);font-weight:800;font-size:28px;text-transform:uppercase;line-height:1;overflow-wrap:anywhere}
.ng-vs .n span{font-size:12.5px;color:var(--band-muted)}
.ng-when{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.02em}
.ng-gym{font-size:13.5px;color:var(--band-fg);display:grid;gap:4px}
.ng-gym span{color:var(--band-muted)}
.maplink{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--band-accent)}
.ng-facts{display:flex;flex-wrap:wrap;gap:6px}
.ng-facts span{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--band-2);border:1px solid var(--band-line);color:var(--band-fg)}
.btn-cta{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;background:var(--band-accent);color:#170a02;font-weight:800;text-decoration:none;font-size:14px}
.btn-cta:hover{text-decoration:none;filter:brightness(1.06)}
.uplist{display:grid;gap:6px}
.upitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none}
.upitem:hover{border-color:var(--accent);text-decoration:none}
.upitem b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upitem .meta{font-size:12px;color:var(--muted)}
.tbc{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--muted);border-radius:4px;padding:2px 6px;white-space:nowrap}
.when{font-size:12px;font-weight:700;color:var(--accent-text);white-space:nowrap}
.mh{background:var(--band);color:var(--band-fg);border:1px solid var(--band-line);border-radius:var(--r);padding:22px clamp(16px,3vw,32px);display:grid;gap:16px}
.mh-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px 20px}
.mh-team{display:flex;align-items:center;gap:14px;min-width:0}
.mh-team.r{justify-content:flex-end;text-align:right}
.mh-team b{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,3.4vw,36px);text-transform:uppercase;line-height:1;overflow-wrap:anywhere}
.mh-mid{display:grid;justify-items:center;gap:4px;text-align:center}
.mh-mid .vs{font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--band-accent)}
.mh-info{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px}
.mh-info div{display:grid;gap:2px}
.mh-info small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--band-muted);font-weight:700}
.verdict{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.v-str{background:var(--fg);color:var(--bg)}
.v-weak{background:var(--accent-wash);color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--accent)}
.v-avg{color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.v-style{color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--fg-2)}
.roles{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.role{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line);white-space:nowrap}
.role.hot{background:var(--accent-wash);color:var(--accent-text);border-color:transparent}
.watch{display:grid;gap:10px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);min-width:0}
.watch-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.watch-h b{font-size:16px}
.watch-h span{font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--accent-text);line-height:1}
.watch p{font-size:13.5px;color:var(--fg-2)}
.watch .mini{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.watch .mini b{color:var(--fg);font-size:13px}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.plan h3{font-size:19px;letter-spacing:.04em;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.plan h3 i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent)}
.plan ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.plan li{position:relative;padding-left:16px;font-size:14px;line-height:1.5;color:var(--fg)}
.plan li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.plan li b{color:var(--fg)}
.formstrip{display:flex;flex-wrap:wrap;gap:6px}
.formstrip span{display:grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:8px;font-family:var(--font-display);font-weight:800;font-size:17px}
.formstrip .W{background:var(--accent);color:var(--accent-ink)}
.formstrip .L{background:var(--surface-2);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--line)}
.tbl tr.us-row td,.tbl tr.us-row td:first-child{background:var(--accent-wash)}
.tbl tr.them-row td,.tbl tr.them-row td:first-child{background:var(--surface-2);font-weight:700}
@media (max-width:860px){.up-grid{grid-template-columns:1fr}.mh-teams{grid-template-columns:1fr;justify-items:start}.mh-team.r{justify-content:flex-start;flex-direction:row-reverse;text-align:left}.mh-mid{justify-items:start}}

/* ---------- logo, finder, theme, motion, cards */
.brand img{width:40px;height:40px;flex:none;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.brand:hover img{transform:rotate(-8deg) scale(1.06)}
.sb-logo{width:58px;height:58px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.finder{position:relative;flex:none;width:min(250px,30vw)}
.finder input{width:100%;height:36px;border-radius:9px;border:1px solid var(--band-line);background:var(--band-2);color:var(--band-fg);padding:0 36px 0 34px;font:inherit;font-size:13.5px;transition:border-color .15s,box-shadow .15s}
.finder input:focus{outline:none;border-color:var(--band-accent);box-shadow:0 0 0 3px rgba(255,122,47,.22)}
.finder input::placeholder{color:var(--band-muted)}
.finder>svg{position:absolute;left:11px;top:11px;width:14px;height:14px;color:var(--band-muted);pointer-events:none}
.finder kbd{position:absolute;right:8px;top:8px;font:600 11px/1.4 var(--font-body);color:var(--band-muted);border:1px solid var(--band-line);border-radius:4px;padding:0 6px;pointer-events:none}
.finder input:not(:placeholder-shown)~kbd,.finder input:focus~kbd{display:none}
.finder-res{position:absolute;right:0;top:44px;width:min(390px,92vw);max-height:440px;overflow:auto;background:var(--band-2);border:1px solid var(--band-line);border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.5);padding:6px;z-index:50;display:grid;gap:1px}
.finder-res a{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--band-fg);text-decoration:none}
.finder-res a[aria-selected="true"],.finder-res a:hover{background:rgba(255,122,47,.16);text-decoration:none}
.finder-res .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
.finder-res .m{display:block;font-size:12px;color:var(--band-muted);font-weight:400}
.finder-res .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--band-muted);font-weight:700}
.finder-res .none{padding:12px;color:var(--band-muted);font-size:13px}
.mono{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--band-accent);color:#170a02;font:800 14px/1 var(--font-display);letter-spacing:.02em}
.mono.alt{background:transparent;box-shadow:inset 0 0 0 1.5px var(--band-muted);color:var(--band-fg);font-size:12px}
.iconbtn{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--band-line);background:var(--band-2);color:var(--band-fg);cursor:pointer;transition:border-color .15s,color .15s}
.iconbtn:hover{border-color:var(--band-accent);color:var(--band-accent)}
.iconbtn svg{width:17px;height:17px}
@keyframes rise{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:none}}
main.gut>*{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
main.gut>*:nth-child(2){animation-delay:.04s} main.gut>*:nth-child(3){animation-delay:.08s} main.gut>*:nth-child(4){animation-delay:.12s}
main.gut>*:nth-child(5){animation-delay:.16s} main.gut>*:nth-child(n+6){animation-delay:.2s}
.nav a{transition:color .15s,border-color .2s}
.kpi{transition:border-color .2s,transform .2s,box-shadow .2s}
.kpi:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.14)}
.lead li{transition:background .15s;border-radius:6px;padding-inline:6px;margin-inline:-6px}
.lead li:hover{background:var(--accent-wash)}
.fact{transition:border-color .2s}
.fact:hover{border-top-color:var(--accent)}
.tbl td{transition:background .12s}
.tbl tr[data-href]:hover td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.vs-bar i{transition:width .6s cubic-bezier(.2,.7,.2,1)}
.seg button{transition:background .15s,color .15s}
.seg button:hover:not([aria-pressed="true"]){color:var(--fg)}
.filters .seg button:hover:not([aria-pressed="true"]){color:var(--band-fg)}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:500 12px/1.35 var(--font-body);letter-spacing:0;white-space:nowrap;z-index:30;box-shadow:0 8px 20px rgba(0,0,0,.25);pointer-events:none}
.tbl-wrap.scroll{max-height:min(72vh,660px);overflow:auto}
.tbl-wrap.scroll th{position:sticky;top:0;z-index:2}
.tbl-wrap.scroll th:first-child{z-index:3}
.totop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 26px rgba(0,0,0,.35);cursor:pointer;display:grid;place-items:center;z-index:25;transition:transform .2s}
.totop:hover{transform:translateY(-3px)}
.totop svg{width:20px;height:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,232px),1fr));gap:12px}
.pcard{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg);text-decoration:none;transition:border-color .2s,transform .2s,box-shadow .2s;min-width:0}
.pcard:hover{text-decoration:none;border-color:var(--accent);transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.2)}
.pcard-h{display:flex;align-items:center;gap:11px;min-width:0}
.pcard-h>div{min-width:0}
.avatar{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:800 19px/1 var(--font-display);letter-spacing:.02em;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--accent)}
.avatar.lg{width:88px;height:88px;font-size:40px;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--accent)}
.pcard-n{font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-s{font-size:12px;color:var(--muted)}
.pcard-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.pcard-stats b{display:block;font:800 26px/1 var(--font-display)}
.pcard-stats span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.spark{width:100%;height:36px;display:block;overflow:visible}
.spark .ln{fill:none;stroke:var(--s-us);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spark .ar{fill:var(--s-us-wash)}
.spark-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.more{justify-self:center;background:none;border:1px solid var(--line);border-radius:999px;padding:7px 16px;font:inherit;font-size:13px;font-weight:600;color:var(--fg-2);cursor:pointer;transition:border-color .15s,color .15s}
.more:hover{border-color:var(--accent);color:var(--accent-text)}
.phead-l{display:flex;align-items:center;gap:20px;min-width:0}
.phead-l>div{min-width:0}

@media (max-width:760px){
  .topbar{position:static}
  .brandrow{gap:8px 10px}
  .finder{order:3;flex-basis:100%;width:100%}
  .hero{grid-template-columns:1fr}
  .hero-logo{order:-1;width:92px}
  .avatar.lg{width:64px;height:64px;font-size:30px}
  .nav a{padding:12px 10px 11px;font-size:16px}
  .f-toggle{display:inline-flex}
  .filters:not(.open)>:not(.f-toggle):not(.f-count){display:none}
  .f-count{margin-left:auto}
  .filters .pop,.filters .fsel{flex:1 1 150px}
  .filters .pop>summary{justify-content:space-between}
  .fsel select{max-width:none;flex:1;min-width:0}
  .pop-body{max-width:calc(100vw - 32px)}
  .panel{padding:14px;gap:12px}
  .panel h2{font-size:20px}
  .sel-row .ctl{flex:1 1 100%}
  .sel-row .ctl select{flex:1;min-width:0}
  .gnav{font-size:13px}
  .sb-main{grid-template-columns:1fr;justify-items:start}
  .sb-team.them{justify-content:flex-start;flex-direction:row-reverse;text-align:left}
  .sb-mid{justify-items:start}
  .court{width:300px;right:-80px;opacity:.14}
  .vs-row,.vs-head{grid-template-columns:1fr 78px 1fr}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>

      <div class="finder" role="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l3.6 3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>

</header>
<main class="gut" id="app" tabindex="-1"></main>

<script>
(function () {
'use strict';
const D = window.PISTOLS_DATA;
const app = document.getElementById('app');
const filtersEl = document.getElementById('filters');
if (!D || !Array.isArray(D.games)) {
  filtersEl.hidden = true;
  app.innerHTML = '<div class="panel empty"><h2>No stats loaded</h2><p>The file <b>data.js</b> is missing next to this page. Double-click <b>Update stats.bat</b> in the Athens Pistols Stats folder, then reload this page.</p></div>';
  return;
}

/* =====================================================================
   Formatting helpers
   ===================================================================== */
const NA = '–';
const isNum = v => typeof v === 'number' && isFinite(v);
const ratio = (n, d) => (d > 0 && isNum(n)) ? n / d : null;
const f0 = v => isNum(v) ? Math.round(v).toLocaleString('en-US') : NA;
const f1 = v => isNum(v) ? v.toFixed(1) : NA;
const f2 = v => isNum(v) ? v.toFixed(2) : NA;
const fp = v => isNum(v) ? (v * 100).toFixed(1) + '%' : NA;
const fp0 = v => isNum(v) ? Math.round(v * 100) + '%' : NA;
const fs1 = v => isNum(v) ? (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(1) : NA;
const fsi = v => isNum(v) ? (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(Math.round(v)) : NA;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fdate(iso, long) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); if (!m) return esc(iso || NA);
  return long ? `${+m[3]} ${MON[+m[2] - 1]} ${m[1]}` : `${m[3]}/${m[2]}/${m[1].slice(2)}`;
}
const rid = s => String(s).replace(/[^A-Za-z0-9-]/g, '-');
function splitName(raw) {
  const t = String(raw || '').trim().split(/\s+/);
  const i = t.findIndex(x => /\.$/.test(x));

}
const disp = raw => { const s = splitName(raw); return s ? `${s.first} ${s.last}` : String(raw || ''); };
const short = raw => { const s = splitName(raw); return s ? `${s.first.charAt(0)}. ${s.last}` : String(raw || ''); };
const seasonLabel = s => { const m = /^(\d{2})\/(\d{2})$/.exec(s || ''); return m ? `20${m[1]}–${m[2]}` : String(s || ''); };
const seasonKey = s => String(s).replace(/\D/g, '');
const plural = (n, w, wp) => `${f0(n)} ${n === 1 ? w : (wp || w + 's')}`;
const recTxt = r => `${r.w}–${r.l}`;
const MVP_ICON = '<span class="mvp" title="MVP of the game"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4 1h8v2h2.5v2.2A3.3 3.3 0 0 1 11.6 8.4 4 4 0 0 1 9 10.3V12h2.5v3h-7v-3H7v-1.7A4 4 0 0 1 4.4 8.4 3.3 3.3 0 0 1 1.5 5.2V3H4V1Zm-1 3.5v.7c0 .7.5 1.4 1.2 1.6A9 9 0 0 1 4 4.5H3Zm10 0h-1c0 .8-.1 1.5-.2 2.3.7-.2 1.2-.9 1.2-1.6v-.7Z"/></svg>MVP</span>';

/* =====================================================================
   Competitions
   ===================================================================== */
const COMP = {
  'W.Master':        { name: 'Winter Master League',      short: 'Winter Master',      type: 'League', phase: 'Winter league' },
  'S.Master':        { name: 'Summer Master League',      short: 'Summer Master',      type: 'League', phase: 'Summer league' },
  'W.Evolution':     { name: 'Winter Evolution League',   short: 'Winter Evolution',   type: 'League', phase: 'Winter league' },
  'S.Evolution':     { name: 'Summer Evolution League',   short: 'Summer Evolution',   type: 'League', phase: 'Summer league' },
  'W.Development 1': { name: 'Winter Development League', short: 'Winter Development', type: 'League', phase: 'Winter league' },
  'Athens Superbet Cup': { name: 'Cup', short: 'Cup', type: 'Cup', phase: 'Cup' }
};
function compInfo(c) {
  if (COMP[c]) return COMP[c];
  const cup = /cup/i.test(c || '');
  return { name: c || 'Other', short: c || 'Other', type: cup ? 'Cup' : 'League', phase: cup ? 'Cup' : /^S\./.test(c) ? 'Summer league' : 'Winter league' };
}

/* =====================================================================
   Data preparation
   ===================================================================== */
const TEAM = D.team || 'Athens Pistols';
const GAMES = D.games.slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0)).map((g, i) => {
  const decided = g.result === 'W' || g.result === 'L';
  const forfeit = g.forfeit === true || g.forfeit === 'True' || g.status === 'forfeit';
  const real = !forfeit && g.status === 'played' && decided && isNum(g.team_score) && isNum(g.opp_score);
  return Object.assign({}, g, {
    i, decided, forfeit, real, ci: compInfo(g.competition),
    rid: g.game_id ? rid(g.game_id) : 'x' + i,
    oppKey: g.opponent_id || ('name-' + rid(g.opponent || 'unknown')),
    mg: real ? g.team_score - g.opp_score : null

});
const GBYID = new Map(GAMES.filter(g => g.game_id).map(g => [g.game_id, g]));
const GBYRID = new Map(GAMES.map(g => [g.rid, g]));
const SEASONS = [...new Set(GAMES.map(g => g.season))].filter(Boolean).sort();
const COMP_ORDER = ['W.Master', 'S.Master', 'W.Evolution', 'S.Evolution', 'W.Development 1', 'Athens Superbet Cup'];
const COMPS = [...new Set(GAMES.map(g => g.competition))].sort((a, b) => {
  const ia = COMP_ORDER.indexOf(a), ib = COMP_ORDER.indexOf(b);
  return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || String(a).localeCompare(b);
});

const SK = ['min', 'pts', 'eff', 'reb', 'oreb', 'dreb', 'ast', 'stl', 'tov', 'blk', 'ftm', 'fta', 'fg2m', 'fg2a', 'fg3m', 'fg3a'];
const TK = SK.concat(['fgm', 'fga']);
function zero() { const t = { n: 0 }; for (const k of TK) t[k] = 0; return t; }
function addT(a, b) { for (const k of TK) a[k] += b[k] || 0; a.n += 1; return a; }
function sum(ls) { const t = zero(); for (const l of ls) addT(t, l); t.n = ls.length; return t; }
const poss = T => T.fga + 0.44 * T.fta - T.oreb + T.tov;

const BOX = new Map();
const LINES = [];
for (const raw of (D.players || [])) {
  const g = GBYID.get(raw.game_id); if (!g) continue;
  const l = Object.assign({}, raw);
  for (const k of SK) l[k] = +l[k] || 0;
  l.g = g;
  l.us = raw.is_our_team === true || raw.is_our_team === 'True';
  l.isMvp = raw.mvp === true || raw.mvp === 'True';
  l.fgm = l.fg2m + l.fg3m; l.fga = l.fg2a + l.fg3a;
  l.gs = l.pts + 0.4 * l.fgm - 0.7 * l.fga - 0.4 * (l.fta - l.ftm) + 0.7 * l.oreb + 0.3 * l.dreb + l.stl + 0.7 * l.ast + 0.7 * l.blk - l.tov;
  l.cats = [l.pts, l.reb, l.ast, l.stl, l.blk].filter(v => v >= 10).length;
  l.key = l.player_id || ('n-' + l.player);
  let b = BOX.get(l.game_id);
  if (!b) { b = { g, us: [], them: [] }; BOX.set(l.game_id, b); }
  (l.us ? b.us : b.them).push(l);
  LINES.push(l);
}
for (const b of BOX.values()) {
  b.usT = sum(b.us); b.themT = sum(b.them);
  b.usOK = b.us.length > 0 && b.usT.pts === b.g.team_score;
  b.themOK = b.them.length > 0 && b.themT.pts === b.g.opp_score;
  b.both = b.us.length > 0 && b.them.length > 0;
  b.full = b.usOK && b.themOK;
}
for (const l of LINES) {
  const b = BOX.get(l.game_id);
  l.tm = l.us ? b.usT : b.themT; l.op = l.us ? b.themT : b.usT;
  l.share = l.tm.min > 0 ? l.min / (l.tm.min / 5) : 0;
  l.ctx = b.both;
}
const boxOf = g => (g && g.game_id) ? BOX.get(g.game_id) : null;

const PL = new Map(), OPL = new Map();
for (const l of LINES) {
  const reg = l.us ? PL : OPL;
  let p = reg.get(l.key);
  if (!p) { p = { id: l.key, rid: rid(l.key), lines: [], teams: new Map() }; reg.set(l.key, p); }
  p.name = l.player; p.disp = disp(l.player); p.short = short(l.player);
  p.lines.push(l); p.teams.set(l.team_id, l.team);
}
for (const p of PL.values()) p.lines.sort((a, b) => a.g.i - b.g.i);
const PLBYRID = new Map([...PL.values()].map(p => [p.rid, p]));
const pOf = l => (l.us ? PL : OPL).get(l.key);

const OPP = new Map();
for (const g of GAMES) {
  let o = OPP.get(g.oppKey);
  if (!o) { o = { key: g.oppKey, rid: rid(g.oppKey), games: [] }; OPP.set(g.oppKey, o); }
  o.name = g.opponent; o.games.push(g);
}
const OBYRID = new Map([...OPP.values()].map(o => [o.rid, o]));
const oppLink = g => { const o = OPP.get(g.oppKey); return o && o.games.some(x => x.decided) ? `<a href="#opponent-${o.rid}">${esc(g.opponent)}</a>` : esc(g.opponent); };
const playerLink = (l, txt) => { if (!l.us) return esc(txt || disp(l.player)); const p = PL.get(l.key); return `<a href="#player-${p.rid}">${esc(txt || p.disp)}</a>`; };
const gameLink = (g, txt) => `<a href="#game-${g.rid}">${txt}</a>`;
const vsTxt = g => (g.home_away === 'Home' ? 'vs ' : 'at ') + g.opponent;

/* =====================================================================
   State: global filters (apply to every section) and per-view UI choices
   ===================================================================== */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
};
const F = Object.assign({ seasons: [], comps: [], opp: '', venue: 'all', result: 'all', forfeits: true }, store.get('pistols.filters', {}));
F.seasons = (F.seasons || []).filter(s => SEASONS.includes(s));
F.comps = (F.comps || []).filter(c => COMPS.includes(c));
if (F.opp && !OPP.has(F.opp)) F.opp = '';
const U = Object.assign({ pmode: 'pg', pmin: '', seaM: 'pts', rec: 'pts', car: 'pts', sb: 'ppg', cmp: [], cmpMode: 'pg', q: {} }, store.get('pistols.ui', {}));
U.q = U.q || {};
const saveF = () => store.set('pistols.filters', F);
const saveU = () => store.set('pistols.ui', U);

function gameOK(g, ignore) {
  ignore = ignore || {};
  if (!ignore.season && F.seasons.length && !F.seasons.includes(g.season)) return false;
  if (F.comps.length && !F.comps.includes(g.competition)) return false;
  if (!ignore.opp && F.opp && g.oppKey !== F.opp) return false;
  if (F.venue !== 'all' && g.home_away !== F.venue) return false;
  if (F.result !== 'all' && g.result !== F.result) return false;
  return true;
}
const fGames = ignore => GAMES.filter(g => gameOK(g, ignore));
function linesFor(games, us = true) { const ids = new Set(games.map(g => g.game_id)); return LINES.filter(l => l.us === us && ids.has(l.game_id)); }
const boxGames = games => games.filter(g => { const b = boxOf(g); return b && b.us.length; });
const autoMin = games => Math.max(1, Math.min(10, Math.round(boxGames(games).length * 0.2)));

/* =====================================================================
   Stats engine
   ===================================================================== */
function record(games) {
  let w = 0, l = 0, fw = 0, fl = 0;
  for (const g of games) {
    if (!g.decided) continue;
    if (g.forfeit) { if (!F.forfeits) continue; if (g.result === 'W') fw++; else fl++; }
    if (g.result === 'W') w++; else l++;
  }
  return { w, l, fw, fl, n: w + l, pct: ratio(w, w + l) };
}
const counted = games => games.filter(g => g.decided && (F.forfeits || !g.forfeit));
function streaks(games) {
  let bestW = 0, bestL = 0, cur = null, len = 0;
  for (const g of counted(games)) {
    if (g.result === cur) len++; else { cur = g.result; len = 1; }
    if (cur === 'W') bestW = Math.max(bestW, len); else bestL = Math.max(bestL, len);
  }
  return { bestW, bestL, cur, len };
}
function four(A, B) {
  return { efg: ratio(A.fgm + 0.5 * A.fg3m, A.fga), tov: ratio(A.tov, A.fga + 0.44 * A.fta + A.tov), orb: ratio(A.oreb, A.oreb + B.dreb), ftr: ratio(A.ftm, A.fga) };
}
function teamAgg(games, bx) {
  bx = bx || boxOf;
  const r = record(games);
  const real = games.filter(g => g.real);
  let pf = 0, pa = 0;
  for (const g of real) { pf += g.team_score; pa += g.opp_score; }
  const full = real.filter(g => { const b = bx(g); return b && b.full; });
  const Us = zero(), Op = zero();
  for (const g of full) { const b = bx(g); addT(Us, b.usT); addT(Op, b.themT); }
  const pU = poss(Us), pO = poss(Op);
  return Object.assign(r, {
    games, real, nReal: real.length, pf, pa,
    ppg: ratio(pf, real.length), oppg: ratio(pa, real.length), mg: ratio(pf - pa, real.length),
    full, nFull: full.length, Us, Op,
    ortg: ratio(100 * Us.pts, pU), drtg: ratio(100 * Op.pts, pO),
    net: (full.length && pU > 0 && pO > 0) ? 100 * Us.pts / pU - 100 * Op.pts / pO : null,
    pace: full.length ? (pU + pO) / 2 / full.length : null,
    fUs: four(Us, Op), fOp: four(Op, Us)

}
function agg(ls) {
  const a = sum(ls);
  a.gp = ls.length; a.mvp = 0; a.dd = 0; a.td = 0; a.gsum = 0; a.p20 = 0; a.p30 = 0; a.w = 0; a.l = 0;
  let mg = 0, mgN = 0;
  for (const x of ls) {
    if (x.isMvp) a.mvp++;
    if (x.cats >= 2) a.dd++;
    if (x.cats >= 3) a.td++;
    if (x.pts >= 20) a.p20++;
    if (x.pts >= 30) a.p30++;
    a.gsum += x.gs;
    if (x.g.result === 'W') a.w++; else if (x.g.result === 'L') a.l++;
    if (x.g.real) { mg += x.g.mg; mgN++; }
  }
  a.winp = ratio(a.w, a.w + a.l); a.mgp = ratio(mg, mgN);
  a.fgp = ratio(a.fgm, a.fga); a.p2 = ratio(a.fg2m, a.fg2a); a.p3 = ratio(a.fg3m, a.fg3a); a.ftp = ratio(a.ftm, a.fta);
  a.efg = ratio(a.fgm + 0.5 * a.fg3m, a.fga); a.ts = ratio(a.pts, 2 * (a.fga + 0.44 * a.fta));
  a.tpar = ratio(a.fg3a, a.fga); a.ftr = ratio(a.fta, a.fga);
  a.ato = a.tov > 0 ? a.ast / a.tov : null;
  a.tovp = ratio(a.tov, a.fga + 0.44 * a.fta + a.tov);
  const n = { use: 0, ast: 0, orb: 0, drb: 0, trb: 0, stl: 0, blk: 0 }, d = { use: 0, ast: 0, orb: 0, drb: 0, trb: 0, stl: 0, blk: 0 };
  for (const x of ls) {
    if (!x.ctx || !(x.share > 0)) continue;
    const s = x.share, T = x.tm, O = x.op;
    n.use += x.fga + 0.44 * x.fta + x.tov; d.use += s * (T.fga + 0.44 * T.fta + T.tov);
    n.ast += x.ast; d.ast += s * T.fgm - x.fgm;
    n.orb += x.oreb; d.orb += s * (T.oreb + O.dreb);
    n.drb += x.dreb; d.drb += s * (T.dreb + O.oreb);
    n.trb += x.reb; d.trb += s * (T.reb + O.reb);
    n.stl += x.stl; d.stl += s * poss(O);
    n.blk += x.blk; d.blk += s * O.fg2a;

}
const pg = (a, k) => ratio(a[k], a.gp);
const p40 = (a, k) => ratio(a[k] * 40, a.min);
function playerRows(lines) {
  const m = new Map();
  for (const l of lines) { if (!m.has(l.key)) m.set(l.key, []); m.get(l.key).push(l); }
  return [...m].map(([key, ls]) => ({ p: pOf(ls[0]), ls, a: agg(ls) }));
}
function topScorer(g) {
  const b = boxOf(g); if (!b || !b.us.length) return null;
  return b.us.reduce((best, l) => (l.pts > best.pts ? l : best), b.us[0]);
}
function pctile(val, pop) {
  if (!isNum(val)) return null;
  const vs = pop.filter(isNum); if (!vs.length) return null;
  let below = 0, eq = 0;
  for (const v of vs) { if (v < val) below++; else if (v === val) eq++; }
  return Math.round(100 * (below + 0.5 * eq) / vs.length);
}
const RADAR = [
  ['Scoring', a => p40(a, 'pts')], ['Rebounding', a => p40(a, 'reb')], ['Playmaking', a => p40(a, 'ast')],
  ['Steals', a => p40(a, 'stl')], ['Blocks', a => p40(a, 'blk')], ['True shooting', a => a.ts],
  ['Ball security', a => isNum(a.tovp) ? -a.tovp : null], ['Efficiency', a => p40(a, 'eff')]
];

/* =====================================================================
   Tables (sortable, searchable)
   ===================================================================== */
const TABLES = {};
function table(id, cols, rows, o) {
  o = o || {};
  const t = TABLES[id] = {
    id, cols, rows, sort: o.sort === undefined ? null : o.sort, desc: o.desc !== false,
    href: o.href || null, foot: o.foot || '', qf: o.qf || null, q: (U.q && U.q[id]) || '', limit: o.limit || 0,
    rank: !!o.rank, empty: o.empty || 'Nothing matches the current filters.', best: o.best || null
  };
  return `<div class="tbl-wrap${o.scroll ? ' scroll' : ''}"><table class="tbl" id="${id}"><thead>${thead(t)}</thead><tbody>${tbody(t)}</tbody>${t.foot ? `<tfoot>${t.foot}</tfoot>` : ''}</table></div>`;
}
function thead(t) {
  return '<tr>' + (t.rank ? '<th class="num" scope="col">#</th>' : '') + t.cols.map(c => {
    const on = t.sort === c.k, can = !!c.v && c.sort !== false;
    const lab = esc(c.label) + (on ? (t.desc ? ' ▾' : ' ▴') : '');
    const inner = can ? `<button type="button" data-sort="${t.id}|${c.k}" title="${esc(c.title || c.label)}">${lab}</button>` : `<span title="${esc(c.title || '')}">${lab}</span>`;
    return `<th class="${c.cls || 'num'}${on ? ' sorted' : ''}" scope="col"${on ? ` aria-sort="${t.desc ? 'descending' : 'ascending'}"` : ''}>${inner}</th>`;
  }).join('') + '</tr>';
}
function sortedRows(t) {
  let rows = t.rows;
  if (t.q && t.qf) { const q = t.q.toLowerCase(); rows = rows.filter(r => t.qf(r).toLowerCase().includes(q)); }
  if (t.sort) {
    const c = t.cols.find(x => x.k === t.sort);
    if (c && c.v) {
      const dir = t.desc ? -1 : 1;
      rows = rows.slice().sort((a, b) => {
        const va = c.v(a), vb = c.v(b);
        const na = va == null || (typeof va === 'number' && !isFinite(va)), nb = vb == null || (typeof vb === 'number' && !isFinite(vb));
        if (na && nb) return 0; if (na) return 1; if (nb) return -1;
        if (typeof va === 'string' || typeof vb === 'string') return String(va).localeCompare(String(vb), 'el') * dir;
        return (va - vb) * dir;
      });
    }
  }
  return t.limit ? rows.slice(0, t.limit) : rows;
}
function cell(c, r) { if (c.html) return c.html(r); const v = c.v ? c.v(r) : ''; return c.f ? c.f(v, r) : esc(v); }
function tbody(t) {
  const rows = sortedRows(t);
  const span = t.cols.length + (t.rank ? 1 : 0);
  if (!rows.length) return `<tr><td class="txt empty-row" colspan="${span}">${esc(t.empty)}</td></tr>`;
  const bestBy = {};
  if (t.best) for (const k of t.best) { const c = t.cols.find(x => x.k === k); if (!c) continue; const vals = rows.map(c.v).filter(isNum); if (vals.length > 1) bestBy[k] = Math.max.apply(null, vals); }
  return rows.map((r, i) => {
    const h = t.href ? t.href(r) : null;
    return `<tr${h ? ` data-href="${h}"` : ''}>` + (t.rank ? `<td class="num rank">${i + 1}</td>` : '') +
      t.cols.map(c => `<td class="${c.cls || 'num'}${bestBy[c.k] != null && c.v(r) === bestBy[c.k] ? ' best' : ''}">${cell(c, r)}</td>`).join('') + '</tr>';
  }).join('');
}
function refreshTable(id) {
  const t = TABLES[id], el = document.getElementById(id); if (!t || !el) return;
  el.tHead.innerHTML = thead(t); el.tBodies[0].innerHTML = tbody(t);

<p><b>EFF</b> Basketaki's efficiency: points + rebounds + assists + steals + blocks − missed shots − turnovers.</p>

function prepScout(s) {

function gamePlan(g, S, ctx, rows, q, hh) {

  if (M.orb >= B.orb + 0.04) D.push(`They crash the offensive glass: ${P(M.orb)} of their misses come back to them (league ${P(B.orb)}). Box out on every shot; guards help on the boards.`);

  else if (M.tovp <= B.tovp - 0.03) D.push(`They protect the ball well (${P(M.tovp, 1)} turnovers per play). Don’t gamble for steals; make them work deep into the shot clock.`);
  if (M.ftr >= B.ftr + 0.08) D.push(`They get to the line a lot (${(M.ftr * 100).toFixed(0)} free throws per 100 shots). Defend with your feet, hands up, no reaching.`);
  if (isNum(M.ftp) && M.ftp < 0.6 && M.ftr > 0) N.push(`They shoot only ${P(M.ftp)} from the free-throw line. In a close finish, fouling is a real option.`);
  if (M.pace >= B.pace + 4) D.push(`They play fast (${f1(M.pace)} possessions a game, league ${f1(B.pace)}): get back on defence after every shot and match up early.`);
  // offence
  if (M.drtg >= B.drtg + 5) O.push(`Their defence leaks points: ${f1(M.drtg)} allowed per 100 possessions (league ${f1(B.drtg)}). Be aggressive from the start.`);
  else if (M.drtg <= B.drtg - 5) O.push(`Tough defence: only ${f1(M.drtg)} allowed per 100 possessions (league ${f1(B.drtg)}). Expect a grind; value every possession.`);
  if (M.oefg >= B.oefg + 0.03) O.push(`Teams shoot well against them (${P(M.oefg)} eFG): take open shots with confidence.`);
  else if (M.oefg <= B.oefg - 0.03) O.push(`They contest shots well (opponents ${P(M.oefg)} eFG): move the ball for the best shot, not the first one.`);
  if (M.drb <= B.drb - 0.04) O.push(`They give up offensive rebounds (they grab only ${P(M.drb)} of the misses they should own). Send a second player to the glass${isNum(U.orb) && U.orb >= B.orb ? `: our own ${P(U.orb)} offensive rebounding is a weapon here` : ''}.`);

  if (M.otov >= B.otov + 0.03 || M.stl >= B.stl + 2) O.push(`They force turnovers (${P(M.otov, 1)} of opponents’ plays, ${f1(M.stl)} steals a game). Simple passes, two hands on the ball, beat pressure with quick ball movement${isNum(U.tovp) && U.tovp > B.tovp ? `. We turn it over on ${P(U.tovp, 1)} of plays ourselves, so this is the key battle` : ''}.`);

      ${kpi('Average margin', fs1(R.mg), plural(R.nReal, 'game') + ' on court')}
      ${kpi('Streak', streak, 'Current run')}
      ${kpi('Head to head', hh.rSeason.n ? recTxt(hh.rSeason) : (hh.rAll.n ? recTxt(hh.rAll) : '0–0'), hh.rSeason.n ? 'This season' : (hh.rAll.n ? 'All-time (no meeting this season)' : 'First meeting'))}
    </div>
    <div><p class="eyebrow" style="color:var(--muted)">Recent form (oldest to newest)</p><div class="formstrip">${form.map(x => `<span class="${x.result}" title="${esc(`${fdate(x.date)} · ${x.home_away === 'Home' ? 'vs' : 'at'} ${x.opponent} · ${x.team_score}–${x.opp_score} · ${x.ci.short}`)}">${x.result}</span>`).join('')}</div></div>
    <p>${h2hLine}</p>`, { sub: `Current season only (${esc(seasonLabel(S.season))}): ${plural(S.games.length, 'game')}, ${plural(boxN, 'box score')}. Older seasons are left out because rosters change.` });

  // game plan first: it's what matters most
  html += panel('Game plan', `<div class="plan">
      <div><h3><i></i>On defence</h3><ul>${plan.D.map(x => `<li>${x}</li>`).join('')}</ul></div>
      <div><h3><i></i>On offence</h3><ul>${plan.O.map(x => `<li>${x}</li>`).join('')}</ul></div>
      <div><h3><i></i>Good to know</h3><ul>${plan.N.map(x => `<li>${x}</li>`).join('') || '<li>Nothing unusual in their results so far.</li>'}</ul></div>
    </div>`, { sub: 'Generated from their box scores, compared with the rest of the league this season.' });

  // players to watch
  const watch = plan.regular.slice(0, 3);
  const pc = [
    { k: 'name', label: 'Player', cls: 'txt', v: r => r.p.disp, html: r => `${esc(r.p.disp)}<div class="roles">${rolesOf(r, teamPts, r === plan.regular[0]).map(([t, h]) => `<span class="role${h ? ' hot' : ''}">${esc(t)}</span>`).join('')}</div>` },
    P.gp, P.pg('min', 'MIN'), P.pg('pts', 'PTS'), { k: 'share', label: 'Share', title: 'Share of the team’s points', v: r => ratio(r.a.pts, teamPts), f: fp0 },
    P.pg('reb', 'REB'), P.pg('oreb', 'OREB'), P.pg('ast', 'AST'), P.pg('stl', 'STL'), P.pg('blk', 'BLK'), P.pg('tov', 'TOV'), P.pg('fg3m', '3PM', '3-pointers made per game'),
    P.pct('p3', '3P%'), P.pct('ftp', 'FT%'), P.pct('ts', 'TS%'), P.pg('eff', 'EFF'), P.tot('mvp', 'MVP')
  ];
  html += panel('Players to watch', `<div class="grid-3">${watch.map(r => `<div class="watch"><div class="watch-h"><b>${esc(r.p.disp)}</b><span>${f1(pg(r.a, 'pts'))}</span></div>
      <div class="mini"><span><b>${f1(pg(r.a, 'reb'))}</b> reb</span><span><b>${f1(pg(r.a, 'ast'))}</b> ast</span><span><b>${fp0(r.a.ts)}</b> TS</span><span><b>${r.a.gp}</b> games</span></div>
      <div class="roles">${rolesOf(r, teamPts, r === plan.regular[0]).map(([t, h]) => `<span class="role${h ? ' hot' : ''}">${esc(t)}</span>`).join('')}</div>
      <p>${esc(playerTip(r)).replace(/^./, c => c.toUpperCase())}.</p></div>`).join('')}</div>` +
    table('t-scout-players', pc, rows, { sort: 'pg_pts', desc: true, scroll: true }),
    { sub: `Per game this season. "Players to watch" are their top scorers among players with at least ${plural(Math.max(1, Math.ceil(boxN * 0.4)), 'game')}.` });

  // how they play
  const hrow = HOWTO.map(h => { const v = verdict(h, M[h.k], B[h.k]); return `<tr><td class="txt">${esc(h.lab)}</td><td class="strong">${h.fmt(M[h.k])}</td><td>${h.fmt(B[h.k])}</td><td>${h.fmt(U[h.k])}</td><td class="txt"><span class="verdict ${v.cls}">${v.txt}</span></td></tr>`; }).join('');
  html += panel('How they play', `<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="txt">Measure</th><th>${esc(S.team)}</th><th>League</th><th>${esc(TEAM)}</th><th class="txt">For them</th></tr></thead><tbody>${hrow}</tbody></table></div>`,
    { sub: `Their ${plural(M.n, 'complete box score')} vs the league average of the other teams in this season's box scores we have (${plural(B.n, 'team game')}). Strength or Weakness is from their side; High or Low describes style.` });

  // matchup + quarters
  html += `<div class="grid-2">
    ${panel('Matchup', vsGeneric(TEAM, S.team, [
      ['Points per game', U.ppg, M.ppg, f1], ['Allowed per game', U.oppg, M.oppg, f1, true], ['Per 100 poss.', U.ortg, M.ortg, f1], ['Allowed /100', U.drtg, M.drtg, f1, true],
      ['eFG%', U.efg, M.efg, fp0], ['3P%', U.p3, M.p3, fp0], ['Turnovers /100', isNum(U.tovp) ? U.tovp * 100 : null, isNum(M.tovp) ? M.tovp * 100 : null, f1, true],
      ['Off. reb. %', U.orb, M.orb, fp0], ['Def. reb. %', U.drb, M.drb, fp0], ['FT%', U.ftp, M.ftp, fp0], ['Pace', U.pace, M.pace, f1]
    ]), { sub: `Both teams this season, games with complete box scores (${plural(U.n, 'game')} for us, ${plural(M.n, 'game')} for them). The better value is highlighted.` })}
    ${q.n ? panel('Quarter by quarter', chart('c-scout-q', 'Their average points scored and allowed per quarter', chScoutQuarters(S, q), 'short') + `<div class="facts">${['1st', '2nd', '3rd', '4th'].map((l, i) => fact(l + ' quarter', fs1(q.mg[i]), `${f1(q.sc[i])} scored · ${f1(q.al[i])} allowed`)).join('')}</div>`, { sub: `Their average per quarter in ${plural(q.n, 'game')} this season.` }) : ''}
  </div>`;

  // league table
  if (UP.standings && UP.standings.length) {
    const tr = UP.standings.map(r => `<tr class="${r.team_id === TEAM_ID ? 'us-row' : r.team_id === g.opponent_id ? 'them-row' : ''}"><td class="num">${r.pos}</td><td class="txt">${tlogo(r.logo, r.team, 20)} ${esc(r.team)}</td><td>${r.gp}</td><td>${r.w}</td><td>${r.l}</td><td>${r.pf}</td><td>${r.pa}</td><td>${fsi(r.diff)}</td><td class="txt">${esc(r.streak || '')}</td></tr>`).join('');
    html += panel('League table', `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th class="txt">Team</th><th>GP</th><th>W</th><th>L</th><th>PF</th><th>PA</th><th>+/−</th><th class="txt">Streak</th></tr></thead><tbody>${tr}</tbody></table></div>`,
      { sub: `${esc((UP.tournament || {}).title || '')} · <a href="${esc((UP.tournament || {}).url || '#')}" target="_blank" rel="noopener">standings on basketaki ↗</a>` });
  }

  // their games this season
  const gcols = [
    { k: 'date', label: 'Date', cls: 'txt', v: x => x.date, html: x => x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${fdate(x.date)}</a>` : fdate(x.date) },
    { k: 'opp', label: 'Opponent', cls: 'txt', v: x => x.opponent, f: v => esc(v) },
    { k: 'ha', label: 'H/A', cls: 'txt', v: x => x.home_away, f: v => esc(v) },
    { k: 'res', label: 'Result', cls: 'txt', v: x => x.result || '', html: x => resBadge(x) },
    { k: 'score', label: 'Score', v: x => x.team_score, html: x => scoreTxt(x) },
    { k: 'mg', label: '+/−', v: x => x.mg, f: fsi },
    { k: 'comp', label: 'Competition', cls: 'txt', v: x => x.ci.short, f: v => esc(v) },
    { k: 'top', label: 'Top scorer', cls: 'txt', v: x => { const b = S.bx(x); return b && b.us.length ? Math.max.apply(null, b.us.map(l => l.pts)) : null; }, html: x => { const b = S.bx(x); if (!b || !b.us.length) return `<span class="muted">${NA}</span>`; const l = b.us.reduce((m, y) => (y.pts > m.pts ? y : m), b.us[0]); return `${esc(short(l.player))} <b>${l.pts}</b>`; } }
  ];
  html += panel('Their games this season', table('t-scout-games', gcols, S.games.slice().reverse(), { sort: 'date', desc: true }), { sub: 'Dates link to the game on basketaki. Score shows their points first.' });
  html += `<p class="small muted">Automatic analysis of basketaki box scores, refreshed every morning. It only covers ${esc(S.team)}'s ${esc(seasonLabel(S.season))} season; small samples early in the season can swing a lot.</p>`;
  return html;
}

const VIEWS = { overview: vOverview, games: vGames, game: vGame, players: vPlayers, player: vPlayer, opponents: vOpponents, opponent: vOpponent, seasons: vSeasons, season: vSeason, team: vTeam, records: vRecords, compare: vCompare, match: vMatch };
const NAV_OF = { game: 'games', player: 'players', opponent: 'opponents', season: 'seasons', match: 'overview' };
function route() {
  let h = location.hash.slice(1); try { h = decodeURIComponent(h); } catch (e) { /* keep raw */ }
  const m = /^(game|player|opponent|season|match)-(.+)$/.exec(h);
  if (m) return { view: m[1], arg: m[2] };
  return { view: VIEWS[h] ? h : 'overview' };
}
let lastHash = null;
const NAV_LABEL = { overview: 'Overview', games: 'Games', players: 'Players', opponents: 'Opponents', seasons: 'Seasons', team: 'Team analytics', records: 'Records', compare: 'Compare players' };
function titleFor(r) {
  if (r.view === 'game') { const g = GBYRID.get(r.arg); return g ? `${fdate(g.date)} ${vsTxt(g)}` : ''; }
  if (r.view === 'player') { const p = PLBYRID.get(r.arg); return p ? p.disp : ''; }
  if (r.view === 'opponent') { const o = OBYRID.get(r.arg); return o ? 'vs ' + o.name : ''; }
  if (r.view === 'season') { const s = SEASONS.find(x => seasonKey(x) === r.arg); return s ? seasonLabel(s) : ''; }
  if (r.view === 'match') { const g = UPBYRID.get(r.arg); return g ? 'Preview vs ' + g.opponent : ''; }
  return r.view === 'overview' ? '' : NAV_LABEL[r.view];
}
function countUp() {
  if (reduceMotion()) return;
  app.querySelectorAll('.countup').forEach(el => {
    const m = /^([+−-]?)(\d+(?:\.\d+)?)(%?)$/.exec(el.textContent.trim()); if (!m) return;
    const target = parseFloat(m[2]), dec = (m[2].split('.')[1] || '').length, t0 = performance.now(), dur = 700;
    const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = m[1] + (target * e).toFixed(dec) + m[3]; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function render(keep, anim) {
  const r = route(), y = window.scrollY;
  destroyCharts(); for (const k in TABLES) delete TABLES[k];
  let html;
  try { html = VIEWS[r.view](r.arg); } catch (e) { console.error(e); html = `<div class="panel empty"><h2>Something went wrong</h2><p>${esc(e.message)}</p></div>`; }
  app.innerHTML = html;
  const nav = NAV_OF[r.view] || r.view;
  document.querySelectorAll('.nav a').forEach(a => { if (a.dataset.view === nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  filtersEl.hidden = r.view === 'game';
  syncFilters();
  mountCharts();
  const tt = titleFor(r);
  document.title = (tt ? tt + ' · ' : '') + 'Athens Pistols Stats';
  if (keep) window.scrollTo(0, y);
  else if (location.hash !== lastHash) { window.scrollTo(0, 0); }
  lastHash = location.hash;
  if (anim) countUp();
}
app.addEventListener('click', e => {
  const cb = e.target.closest('[data-cal]');
  if (cb) { calMonth = cb.dataset.cal; render(true); return; }
  const sb = e.target.closest('[data-sort]');
  if (sb) {
    const [id, k] = sb.dataset.sort.split('|'); const t = TABLES[id]; if (!t) return;
    const col = t.cols.find(c => c.k === k);
    if (t.sort === k) t.desc = !t.desc; else { t.sort = k; t.desc = !(col && col.cls === 'txt'); }
    refreshTable(id); return;
  }
  const ub = e.target.closest('button[data-ui]');
  if (ub) { U[ub.dataset.ui] = ub.dataset.v; saveU(); render(true); return; }
  const tr = e.target.closest('tr[data-href]');
  if (tr && !e.target.closest('a,button,input,select,label')) location.hash = tr.dataset.href;
});
app.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('select[data-ui]')) { U[t.dataset.ui] = t.value; saveU(); render(true); }
  else if (t.matches('input[data-ui-num]')) { U[t.dataset.uiNum] = t.value === '' ? '' : Math.max(0, parseInt(t.value, 10) || 0); saveU(); render(true); }
  else if (t.matches('select[data-cmp]')) {
    const cur = [0, 1, 2].map(i => { const s = document.getElementById('cmp-' + i); return s ? s.value : ''; }).filter(Boolean);
    U.cmp = [...new Set(cur)]; saveU(); render(true);
  }
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('input[data-q]')) { const id = t.dataset.q; U.q[id] = t.value; if (TABLES[id]) { TABLES[id].q = t.value; refreshTable(id); } saveU(); }
});
window.addEventListener('hashchange', () => render(false, true));

/* ---------- quick finder (press / to focus) */
const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const FIND = [];
for (const p of PL.values()) {
  const ss = SEASONS.filter(s => p.lines.some(l => l.g.season === s));
  FIND.push({ kind: 'Player', label: p.disp, sub: `${plural(p.lines.length, 'game')} · ${seasonLabel(ss[0])}${ss.length > 1 ? ' to ' + seasonLabel(ss[ss.length - 1]) : ''}`, href: '#player-' + p.rid, mono: initials(p), q: fold(p.disp + ' ' + p.name + ' ' + p.id.replace(/-/g, ' ')), w: p.lines.length });
}
for (const o of OPP.values()) {
  const dec = o.games.filter(g => g.decided); if (!dec.length) continue;
  const w = dec.filter(g => g.result === 'W').length;
  FIND.push({ kind: 'Opponent', label: o.name, sub: `${w}–${dec.length - w} in ${plural(dec.length, 'game')}`, href: '#opponent-' + o.rid, mono: 'VS', alt: true, q: fold(o.name + ' ' + o.key.replace(/-/g, ' ')), w: dec.length });
}
for (const s of SEASONS) FIND.push({ kind: 'Season', label: seasonLabel(s), sub: plural(GAMES.filter(g => g.season === s).length, 'game'), href: '#season-' + seasonKey(s), mono: s.slice(0, 2), alt: true, q: fold(seasonLabel(s) + ' ' + s + ' season'), w: 0 });
for (const [k, v] of Object.entries(NAV_LABEL)) FIND.push({ kind: 'Page', label: v, sub: 'Section', href: '#' + k, mono: '→', alt: true, q: fold(v), w: -1 });
const finder = document.getElementById('finder'), fres = document.getElementById('finder-res');
let fsel = 0, fhits = [];
function findRender() {
  const q = fold(finder.value.trim());
  if (!q) { fres.hidden = true; finder.setAttribute('aria-expanded', 'false'); return; }
  const words = q.split(/\s+/);
  fhits = FIND.filter(x => words.every(w => x.q.includes(w))).map(x => ({ x, s: (x.q.startsWith(q) ? 2 : 0) + (x.q.split(' ').some(t => t.startsWith(words[0])) ? 1 : 0) }))
    .sort((a, b) => b.s - a.s || b.x.w - a.x.w).slice(0, 9).map(h => h.x);
  fsel = 0;
  fres.innerHTML = fhits.length ? fhits.map((x, i) => `<a href="${x.href}" role="option" id="fopt-${i}" aria-selected="${i === fsel}"><span class="mono${x.alt ? ' alt' : ''}">${esc(x.mono)}</span><span class="t">${esc(x.label)}<span class="m">${esc(x.sub)}</span></span><span class="k">${x.kind}</span></a>`).join('') : '<div class="none">No player, team or season matches.</div>';
  fres.hidden = false; finder.setAttribute('aria-expanded', 'true');
}
function findMove(d) { if (!fhits.length) return; fsel = (fsel + d + fhits.length) % fhits.length; fres.querySelectorAll('a').forEach((a, i) => a.setAttribute('aria-selected', String(i === fsel))); const el = document.getElementById('fopt-' + fsel); if (el) el.scrollIntoView({ block: 'nearest' }); }
function findClose() { fres.hidden = true; finder.setAttribute('aria-expanded', 'false'); }
finder.addEventListener('input', findRender);
finder.addEventListener('focus', () => { if (finder.value.trim()) findRender(); });
finder.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); findMove(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); findMove(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); if (fhits[fsel]) { location.hash = fhits[fsel].href; finder.value = ''; findClose(); finder.blur(); } }
  else if (e.key === 'Escape') { finder.value = ''; findClose(); finder.blur(); }
});
fres.addEventListener('click', e => { if (e.target.closest('a')) { finder.value = ''; findClose(); } });
document.addEventListener('click', e => { if (!e.target.closest('.finder')) findClose(); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey && !/^(INPUT|SELECT|TEXTAREA)$/.test((e.target.tagName || '')) && !e.target.isContentEditable) { e.preventDefault(); finder.focus(); }
});

/* ---------- theme switch: system -> light -> dark */
const themeBtn = document.getElementById('theme-btn');
const THEME_ICON = {
  system: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 3a7 7 0 0 1 0 14Z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 1.8v2.4M10 15.8v2.4M1.8 10h2.4M15.8 10h2.4M4.2 4.2l1.7 1.7M14.1 14.1l1.7 1.7M4.2 15.8l1.7-1.7M14.1 5.9l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  dark: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.3A7 7 0 0 1 7.7 3.5a7 7 0 1 0 8.8 8.8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>'
};
function applyTheme(m) {
  if (m === 'light' || m === 'dark') document.documentElement.setAttribute('data-theme', m); else document.documentElement.removeAttribute('data-theme');
  themeBtn.innerHTML = THEME_ICON[m] || THEME_ICON.system;
  const lab = { system: 'Theme: follows your device. Click for light', light: 'Theme: light. Click for dark', dark: 'Theme: dark. Click to follow your device' }[m] || '';
  themeBtn.setAttribute('aria-label', lab); themeBtn.title = lab;
}
let themeMode = store.get('pistols.theme', 'system');
applyTheme(themeMode);
themeBtn.addEventListener('click', () => { themeMode = { system: 'light', light: 'dark', dark: 'system' }[themeMode] || 'system'; store.set('pistols.theme', themeMode); applyTheme(themeMode); });

/* ---------- back to top */
const totop = document.getElementById('totop');
let topTick = false;
window.addEventListener('scroll', () => { if (topTick) return; topTick = true; requestAnimationFrame(() => { totop.hidden = window.scrollY < 700; topTick = false; }); }, { passive: true });
totop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' }));
if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: dark)'); const re = () => render(true); if (mq.addEventListener) mq.addEventListener('change', re); else if (mq.addListener) mq.addListener(re); }

document.getElementById('foot-src').innerHTML = `Data from <a href="${esc(D.source || 'https://www.basketaki.com')}" target="_blank" rel="noopener">basketaki.com</a> · ${plural(GAMES.length, 'game')} · ${plural(PL.size, 'player')}`;
document.getElementById('foot-upd').textContent = D.scraped_at ? `Last updated ${fdate(String(D.scraped_at).slice(0, 10), 1)}` : '';
buildFilters();
render(false, true);
new MutationObserver(() => render(true)).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
